services:
  postgres:
    image: postgres:16-alpine
    container_name: notuslab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-notuslab_lims}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-notuslab_lims}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notuslab_network

volumes:
  postgres_data:
    name: notuslab_postgres_data
    driver: local

networks:
  notuslab_network:
    name: notuslab_network
    driver: bridge
